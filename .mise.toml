[tools]
go = "1.25.10"
golangci-lint = "2.12.2"
lefthook = "2.1.6"
gofumpt = "0.10.0"
actionlint = "1.7.12"
"go:golang.org/x/tools/cmd/goimports" = "0.45.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"

[tasks.install]
description = "install pinned tools and pre-commit hooks"
run = "lefthook install"

[tasks.build]
description = "build the lazygcl binary"
run = "go build -o lazygcl ./cmd/lazygcl"

[tasks.test]
description = "run unit tests with the race detector"
run = "go test -race -shuffle=on ./..."

[tasks.lint]
description = "run static analysis"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "format the codebase in place"
run = '''
gofumpt -w .
goimports -w .
'''

[tasks.fmt-check]
description = "fail if any file needs gofumpt or goimports"
run = '''
unformatted=$(gofumpt -l .)
if [ -n "$unformatted" ]; then
  echo "Files need 'mise run fmt' (gofumpt):"
  echo "$unformatted"
  exit 1
fi
unformatted=$(goimports -l .)
if [ -n "$unformatted" ]; then
  echo "Files need 'mise run fmt' (goimports):"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.tidy-check]
description = "fail if go.mod / go.sum are not tidy"
run = "go mod tidy -diff"

[tasks.vuln]
description = "scan for known Go vulnerabilities"
run = "govulncheck ./..."

[tasks.actionlint]
description = "lint GitHub Actions workflows"
run = "actionlint .github/workflows/*.yml"

[tasks.check]
description = "run everything CI runs"
depends = ["lint", "fmt-check", "tidy-check", "test", "vuln", "actionlint"]
