version: "2"

linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        gcp-layer:
          files:
            - "**/internal/gcp/**"
          deny:
            - pkg: "github.com/cozy-corner/lazygcl/internal/tui"
              desc: "internal/gcp is the lower layer — internal/tui depends on it, not the other way around"
            - pkg: "github.com/charmbracelet/bubbletea"
              desc: "internal/gcp must not import UI libraries (Bubble Tea belongs in internal/tui)"
            - pkg: "github.com/charmbracelet/bubbles"
              desc: "internal/gcp must not import UI libraries (Bubbles belongs in internal/tui)"
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "internal/gcp must not import UI libraries (lipgloss belongs in internal/tui)"
            - pkg: "github.com/alecthomas/chroma"
              desc: "internal/gcp must not import UI/rendering libraries (chroma belongs in internal/tui)"
            - pkg: "github.com/sahilm/fuzzy"
              desc: "internal/gcp must not import UI libraries (fuzzy matching belongs in internal/tui)"
