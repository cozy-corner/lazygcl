pre-commit:
  commands:
    goimports:
      glob: "*.go"
      run: mise exec -- goimports -w {staged_files}
      stage_fixed: true
    tidy-check:
      glob:
        - "*.go"
        - "go.mod"
        - "go.sum"
      run: mise exec -- go mod tidy -diff
    lint:
      glob: "*.go"
      run: mise exec -- golangci-lint run --new-from-rev=HEAD --fix=false ./...
